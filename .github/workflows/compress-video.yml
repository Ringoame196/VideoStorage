name: Compress MP4 Videos and Delete Originals

on:
  push:
    paths:
      - 'videos/**/*.mp4'

jobs:
  compress:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Compress and replace MP4 files
        run: |
          find videos -name '*.mp4' | while read -r f; do
            echo "Compressing: $f"
            ffmpeg -i "$f" -vcodec libx264 -crf 32 -preset veryslow -acodec aac -b:a 96k "compressed.mp4"
            mv compressed.mp4 "$f"
          done

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add videos/
          git diff --cached --quiet || git commit -m "Auto-compressed and replaced MP4 video"
          git push
